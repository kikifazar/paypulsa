
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPulsa - Pembayaran Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: #102b55;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 27px;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 7px;
      color: #c8d8f2;
      font-size: 13px;
    }

    .container {
      max-width: 460px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 17px;
      box-shadow: 0 8px 30px rgba(20, 40, 80, .08);
    }

    .card h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .description {
      color: #68758a;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 23px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce3ed;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
      background: white;
    }

    input:focus, select:focus {
      border-color: #2468c9;
    }

    .price {
      background: #eef4ff;
      padding: 16px;
      border-radius: 10px;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price span {
      font-size: 13px;
      color: #52627b;
    }

    .price strong {
      color: #174b91;
      font-size: 20px;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      background: #1769d2;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #hasil {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice {
      background: #fff7e6;
      color: #825b16;
      border-radius: 9px;
      padding: 12px;
      margin-top: 17px;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #8994a5;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>PAYPULSA</h1>
    <p>Solusi pembayaran digital yang praktis</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Buat Pesanan</h2>
      <p class="description">
        Silakan isi informasi berikut untuk melanjutkan
        pengujian pembayaran.
      </p>

      <form id="formPesanan">
        <label for="nama">Nama pelanggan</label>
        <input id="nama" type="text"
          placeholder="Masukkan nama" required>

        <label for="email">Email pelanggan</label>
        <input id="email" type="email"
          placeholder="Masukkan email" required>

        <label for="layanan">Pilih layanan</label>
        <select id="layanan">
          <option value="Top Up PayPal">Top Up PayPal</option>
          <option value="Convert Pulsa">Convert Pulsa</option>
        </select>

        <div class="price">
          <span>Nominal pengujian</span>
          <strong>USD 5.00</strong>
        </div>

        <button type="submit" id="tombolBayar">
          Bayar dengan PayPal
        </button>
      </form>

      <div id="hasil" role="status"></div>

      <div class="notice">
        Mode Sandbox: pembayaran ini hanya untuk pengujian,
        bukan transaksi uang sungguhan.
      </div>
    </section>
  </main>

  <footer>
    PayPulsa &copy; 2026
  </footer>

  <script>
    const PAYPULSA_API =
      "https://paypulsa-api.shanowellexcel.workers.dev";

    const hasil = document.getElementById("hasil");
    const tombol = document.getElementById("tombolBayar");

    async function buatPesanan() {
      hasil.innerText = "Menghubungkan ke PayPal Sandbox...";
      tombol.disabled = true;

      try {
        const res = await fetch(
          `${PAYPULSA_API}/api/create-order`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({})
          }
        );

        const data = await res.json();

        if (!res.ok || !data.approval_url) {
          throw new Error(
            data.error || "Gagal membuat pesanan PayPal"
          );
        }

        hasil.innerText =
          "Pesanan berhasil dibuat. Mengalihkan ke PayPal...";

        window.location.href = data.approval_url;

      } catch (error) {
        hasil.innerText =
          "Terjadi kesalahan: " + error.message;
        tombol.disabled = false;
      }
    }

    document.getElementById("formPesanan")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        buatPesanan();
      });

    async function periksaPembayaran() {
      const params = new URLSearchParams(window.location.search);
      const orderID = params.get("token");

      if (!orderID) return;

      hasil.innerText = "Memeriksa pembayaran...";
      tombol.disabled = true;

      try {
        const res = await fetch(
          `${PAYPULSA_API}/api/capture-order`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              orderID: orderID
            })
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(
            data.error || "Pembayaran belum dapat diproses"
          );
        }

        if (data.status === "COMPLETED") {
          hasil.innerText =
            "Pembayaran Sandbox berhasil! Status: COMPLETED";
        } else {
          hasil.innerText =
            "Status pembayaran: " + data.status;
        }

      } catch (error) {
        hasil.innerText =
          "Gagal memeriksa pembayaran: " + error.message;
      } finally {
        tombol.disabled = false;
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      }
    }

    periksaPembayaran();
  </script>

</body>
</html>
